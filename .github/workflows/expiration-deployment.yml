name: deploy-expiration
on: 
    push:
        branches: 
          - main
jobs:
  build:

          runs-on: ubuntu-latest
          environment: Docker-secret
          steps:
            - uses: actions/checkout@v2 
            - name: Debug username
              run: echo "USERNAME=${{ secrets.DOCKERUSERNAME }}"
            - run: echo "${{ secrets.ORIGINALDOCKERTOKENPASSWORD }}" | docker login -u "${{ secrets.DOCKERUSERNAME }}" --password-stdin
            - run:  docker build -t ${{ secrets.DOCKERUSERNAME }}/expiration .
            - run: docker push ${{ secrets.DOCKERUSERNAME }}/expiration
            - name: Auth to GCP
              uses: google-github-actions/auth@v2
              with:
                credentials_json: '${{ secrets.GCS_SECRET }}'
            
            - name: Setup gcloud
              uses: google-github-actions/setup-gcloud@v2
              with:
                project_id: ${{ secrets.GCP_PROJECT_ID }}
            - name: Verify
              run: gcloud projects list
            - run: kubectl rollout restart deployment expiration-depl
